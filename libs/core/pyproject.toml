[project]
name = "gitcog"
version = "0.1.0"
description = "Core of gitcog cli tool"
readme = "README.md"
authors = [
    { name = "Kotaro Usui", email = "111988437+rainfallseason@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
gitcog = "gitcog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"